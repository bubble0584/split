<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <link rel="stylesheet" href="css/common.css" />

    <link rel="stylesheet" href="css/settlement-room.css" />

    <title>정산방 | 스플릿</title>
  </head>

  <body>
    <main class="app-screen settlement-room-screen">
      <!-- =========================
           상단 헤더
      ========================== -->

      <header class="settlement-room-header">
        <button type="button" class="back-button" id="backButton">
          <img src="image/back.svg" alt="뒤로가기" />
        </button>

        <h1>정산방</h1>

        <div class="header-space"></div>
      </header>

      <!-- =========================
           본문
      ========================== -->

      <section class="settlement-room-content">
        <!-- =========================
             상단 옵션
        ========================== -->

        <div class="room-option-row">
          <label class="history-checkbox-label" for="showHistoryCheckbox">
            <input type="checkbox" id="showHistoryCheckbox" />

            <span class="custom-checkbox"></span>

            <span class="history-checkbox-text"> 과거 정산 보기 </span>
          </label>
        </div>

        <!-- =========================
             제목
        ========================== -->

        <div class="room-list-title-row">
          <h2 id="roomListTitle">진행 중인 정산</h2>
        </div>

        <!-- =========================
             정산 목록
        ========================== -->

        <div class="settlement-room-list" id="settlementRoomList"></div>

        <!-- =========================
             빈 화면
        ========================== -->

        <div class="empty-room-message hidden" id="emptyRoomMessage">
          <strong> 진행 중인 정산이 없어요. </strong>

          <p>새로운 정산을 시작해 보세요.</p>
        </div>
      </section>

      <!-- =========================
           하단 네비게이션
      ========================== -->

      <nav class="bottom-nav">
        <a href="07_정산방.html" class="nav-item active">
          <img src="image/room.svg" alt="정산방" class="nav-image" />

          <span> 정산방 </span>
        </a>

        <div class="nav-center-space"></div>

        <a href="06_mypage.html" class="nav-item">
          <img src="image/mypage.svg" alt="마이페이지" class="nav-image" />

          <span> 마이페이지 </span>
        </a>
      </nav>

      <!-- =========================
           중앙 + 버튼
      ========================== -->

      <button type="button" class="main-add-button" id="mainAddButton">
        +
      </button>

      <!-- =========================
           + 메뉴
      ========================== -->

      <div class="settlement-overlay" id="settlementOverlay">
        <div class="settlement-menu">
          <a href="08_create-room.html?mode=together"> 함께 정산하기 </a>

          <span class="menu-divider"></span>

          <a href="08_create-room.html?mode=quick"> 빠르게 정산하기 </a>

          <span class="menu-divider"></span>

          <button type="button" id="joinRoomButton">
            기존 정산방 참여하기
          </button>
        </div>
      </div>
    </main>

    <script src="js/settlement-room.js"></script>
  </body>
</html>
