<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <link rel="stylesheet" href="css/common.css" />
    <link rel="stylesheet" href="css/find-id.css" />

    <title>ID 찾기 | 스플릿</title>
  </head>

  <body>
    <main class="app-screen find-id-screen">
      <section class="find-id-box">
        <h1>ID 찾기</h1>

        <!-- 이메일 -->
        <div class="find-field">
          <label for="email">이메일</label>

          <div class="input-button-wrap">
            <input
              type="email"
              id="email"
              placeholder="이메일 주소를 입력해 주세요."
            />

            <button type="button" id="sendCodeButton">인증하기</button>
          </div>
        </div>

        <!-- 인증번호 -->
        <div class="find-field">
          <label for="verificationCode">인증번호</label>

          <div class="input-button-wrap">
            <input
              type="text"
              id="verificationCode"
              placeholder="이메일로 전송된 인증번호를 입력해 주세요."
              maxlength="6"
            />

            <button type="button" id="verifyCodeButton">인증확인</button>
          </div>
        </div>

        <!-- ID 찾기 -->
        <button type="button" class="find-id-button" id="findIdButton">
          ID 찾기
        </button>
      </section>
    </main>

    <script src="js/find-id.js"></script>
  </body>
</html>
