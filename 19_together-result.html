<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <link rel="stylesheet" href="css/common.css" />
    <link rel="stylesheet" href="css/together-result.css" />

    <title>정산 결과 | 스플릿</title>
  </head>

  <body>
    <main class="app-screen together-result-screen">
      <!-- =========================
           상단 헤더
      ========================== -->

      <header class="result-header">
        <button type="button" class="back-button" id="resultBackButton">
          <img src="image/back.svg" alt="뒤로가기" />
        </button>

        <h1>정산 결과</h1>

        <div class="header-space"></div>
      </header>

      <!-- =========================
           전체 참여자 정산 결과
      ========================== -->

      <section class="result-participant-section" id="resultParticipantSection">
        <div class="result-participant-list" id="resultParticipantList"></div>
      </section>

      <!-- =========================
           개인 정산 상세
      ========================== -->

      <section class="person-detail-view hidden" id="personDetailView">
        <!-- 상세 헤더 -->

        <div class="person-detail-header">
          <button
            type="button"
            class="detail-back-button"
            id="detailBackButton"
          >
            ←
          </button>

          <h2 id="detailPersonName">정산 상세</h2>

          <div class="detail-header-space"></div>
        </div>

        <!-- =========================
             개인 진행도
        ========================== -->

        <section class="personal-progress-card">
          <div class="personal-progress-top">
            <span class="personal-progress-label"> 내 정산 진행도 </span>

            <strong
              class="personal-progress-percent"
              id="personalProgressPercent"
            >
              0%
            </strong>
          </div>

          <div class="personal-progress-bar">
            <div class="personal-progress-fill" id="personalProgressFill"></div>
          </div>

          <p class="personal-progress-text" id="personalProgressText">
            0건 중 0건 완료
          </p>
        </section>

        <!-- =========================
             내가 보내야 할 돈
        ========================== -->

        <section class="transfer-section" id="transferSection">
          <h3>송금 내역</h3>

          <div class="transfer-list" id="transferList"></div>
        </section>

        <!-- =========================
             내가 받을 돈
        ========================== -->

        <section class="receive-section hidden" id="receiveSection">
          <h3>받을 금액</h3>

          <div class="receive-list" id="receiveList"></div>
        </section>

        <!-- =========================
             정산 완료
        ========================== -->

        <section
          class="settlement-complete-card hidden"
          id="settlementCompleteCard"
        >
          <strong>정산 완료!</strong>

          <p>내가 보내야 할 송금을 모두 완료했어요.</p>
        </section>
      </section>

      <!-- =========================
           하단 버튼
      ========================== -->

      <button
        type="button"
        class="result-confirm-button"
        id="resultConfirmButton"
      >
        홈으로
      </button>
    </main>

    <script src="js/together-result.js"></script>
  </body>
</html>
