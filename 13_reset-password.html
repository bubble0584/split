<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <link rel="stylesheet" href="css/common.css" />

    <link rel="stylesheet" href="css/reset-password.css" />

    <title>새 비밀번호 설정 | 스플릿</title>
  </head>

  <body>
    <main class="app-screen reset-password-screen">
      <section class="reset-password-box">
        <h1>새로운 비밀번호를 입력해 주세요.</h1>

        <!-- 새 비밀번호 -->

        <div class="reset-field">
          <label for="newPassword"> 비밀번호 </label>

          <input
            type="password"
            id="newPassword"
            placeholder="5~20자, 영문 및 숫자를 포함해 주세요."
          />
        </div>

        <!-- 비밀번호 확인 -->

        <div class="reset-field">
          <label for="newPasswordConfirm"> 비밀번호 확인 </label>

          <input
            type="password"
            id="newPasswordConfirm"
            placeholder="비밀번호를 다시 입력해 주세요."
          />
        </div>

        <!-- 오류 메시지 -->

        <p class="reset-message" id="resetMessage"></p>

        <!-- 완료 -->

        <button
          type="button"
          class="reset-complete-button"
          id="resetCompleteButton"
        >
          완료
        </button>
      </section>
    </main>

    <script src="js/reset-password.js"></script>
  </body>
</html>
