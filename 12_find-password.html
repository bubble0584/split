<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <link rel="stylesheet" href="css/common.css" />
    <link rel="stylesheet" href="css/find-password.css" />

    <title>비밀번호 찾기 | 스플릿</title>
  </head>

  <body>
    <main class="app-screen find-password-screen">
      <section class="find-password-box">
        <h1>비밀번호 찾기</h1>

        <!-- ID -->

        <div class="find-field">
          <label for="userId">ID</label>

          <input
            type="text"
            id="userId"
            class="normal-input"
            placeholder="ID를 입력해 주세요."
          />
        </div>

        <!-- 이메일 -->

        <div class="find-field">
          <label for="email">이메일</label>

          <div class="input-button-wrap">
            <input
              type="email"
              id="email"
              placeholder="이메일 주소를 입력해 주세요."
            />

            <button type="button" id="sendCodeButton">인증하기</button>
          </div>
        </div>

        <!-- 인증번호 -->

        <div class="find-field">
          <label for="verificationCode"> 인증번호 </label>

          <div class="input-button-wrap">
            <input
              type="text"
              id="verificationCode"
              maxlength="6"
              placeholder="이메일로 전송된 인증번호를 입력해 주세요."
              disabled
            />

            <button type="button" id="verifyCodeButton" disabled>
              인증확인
            </button>
          </div>

          <p class="verification-message" id="verificationMessage"></p>
        </div>

        <!-- 다음 -->

        <button type="button" class="next-button" id="nextButton">다음</button>
      </section>
    </main>

    <script src="js/find-password.js"></script>
  </body>
</html>
