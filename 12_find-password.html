<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <link rel="stylesheet" href="css/common.css" />
    <link rel="stylesheet" href="css/find-password.css" />

    <title>비밀번호 찾기 | 스플릿</title>
  </head>

  <body>
    <main class="app-screen find-password-screen">
      <section class="find-password-box">
        <h1>비밀번호 찾기</h1>

        <!-- ID -->
        <div class="find-password-field">
          <label for="userId">ID</label>

          <input type="text" id="userId" placeholder="ID를 입력해 주세요." />
        </div>

        <!-- 휴대폰 번호 -->
        <div class="find-password-field">
          <label for="phone">휴대폰 번호</label>

          <div class="verify-input-box">
            <input
              type="tel"
              id="phone"
              placeholder="휴대폰 번호를 입력해 주세요."
            />

            <button type="button" id="sendCodeButton">인증하기</button>
          </div>
        </div>

        <!-- 인증번호 -->
        <div class="find-password-field">
          <label for="verificationCode">인증번호</label>

          <div class="verify-input-box">
            <input
              type="text"
              id="verificationCode"
              placeholder="인증번호를 입력해 주세요."
            />

            <button type="button" id="verifyCodeButton">인증완료</button>
          </div>
        </div>

        <!-- 오류 메시지 -->
        <p id="findPasswordMessage"></p>

        <!-- 다음 -->
        <button type="button" id="nextButton" class="find-password-button">
          다음
        </button>
      </section>
    </main>

    <script src="js/find-password.js"></script>
  </body>
</html>
