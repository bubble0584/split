<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <link rel="stylesheet" href="css/common.css" />

    <link rel="stylesheet" href="css/home.css" />

    <title>홈 | 스플릿</title>
  </head>

  <body>
    <main class="app-screen home-screen">
      <!-- =========================
           상단 헤더
      ========================== -->

      <header class="home-header">
        <div></div>

        <div class="header-icons">
          <button class="icon-button" type="button">
            <img src="image/알림.svg" alt="알림" />
          </button>

          <button class="icon-button" type="button">
            <img src="image/더보기.svg" alt="더보기" />
          </button>
        </div>
      </header>

      <!-- =========================
           메인
      ========================== -->

      <section class="home-content">
        <!-- 함께 정산 -->

        <div class="start-card">
          <h2>함께 정산해 볼까요?</h2>

          <p>각자가 지불한 항목을 추가하여 정산해요.</p>

          <a href="08_create-room.html?mode=together" class="start-button">
            <span class="plus-small"> + </span>

            정산 시작하기
          </a>
        </div>

        <!-- 빠르게 정산 -->

        <div class="start-card">
          <h2>빠르게 정산해 볼까요?</h2>

          <p>항목별 참여자를 선택해 정산해요.</p>

          <a href="08_create-room.html?mode=quick" class="start-button">
            <span class="plus-small"> + </span>

            정산 시작하기
          </a>
        </div>

        <!-- =========================
             진행 중인 정산
        ========================== -->

        <section class="settlement-section">
          <h2 class="section-title">진행 중인 정산</h2>

          <div id="settlementList"></div>
        </section>
      </section>

      <!-- =========================
           하단 메뉴
      ========================== -->

      <nav class="bottom-nav">
        <a href="07_정산방.html" class="nav-item">
          <img src="image/정산방 아이콘.svg" alt="정산방" class="nav-image" />
          <span>정산방</span>
        </a>

        <div class="nav-center-space"></div>

        <a href="06_mypage.html" class="nav-item">
          <img
            src="image/마이페이지 아이콘.svg"
            alt="마이페이지"
            class="nav-image"
          />
          <span>마이페이지</span>
        </a>
      </nav>

      <!-- =========================
           가운데 + 버튼
      ========================== -->

      <button class="main-add-button" type="button">+</button>

      <!-- =========================
           정산 방식 선택
      ========================== -->

      <div class="settlement-overlay" id="settlementOverlay">
        <div class="settlement-menu">
          <a href="08_create-room.html?mode=together"> 함께 정산하기 </a>

          <span class="menu-divider"></span>

          <a href="08_create-room.html?mode=quick"> 빠르게 정산하기 </a>

          <span class="menu-divider"></span>

          <button type="button" id="joinRoomButton">
            기존 정산방 참여하기
          </button>
        </div>
      </div>
    </main>

    <script src="js/home.js"></script>
  </body>
</html>
