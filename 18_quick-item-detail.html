<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>항목 상세</title>

    <link rel="stylesheet" href="css/common.css" />
    <link rel="stylesheet" href="css/quick-item-detail.css" />
  </head>

  <body>
    <!-- 뒤쪽 어두운 배경 -->
    <div class="detail-backdrop" id="detailBackdrop"></div>

    <!-- 밑에서 올라오는 상세창 -->
    <main class="item-detail-sheet" id="detailSheet">
      <!-- 드래그 핸들 -->
      <div class="sheet-handle-area" id="sheetHandle">
        <div class="sheet-handle"></div>
      </div>

      <!-- 제목 -->
      <section class="item-summary">
        <h1 id="detailItemName"></h1>

        <!-- quick 모드일 때만 표시 -->
        <p class="detail-total-amount hidden" id="detailItemAmount"></p>
      </section>

      <!-- 결제자: together 모드에서만 표시 -->
      <div class="payer-row hidden" id="payerRow">
        <div class="payer-profile">
          <img
            id="payerProfileImage"
            src="./image/프로필.svg"
            alt="결제자 프로필"
          />
        </div>

        <span class="payer-name" id="payerName"></span>

        <span class="payer-amount" id="payerAmount"></span>
      </div>

      <!-- 참여자 -->
      <section class="participant-detail-card">
        <h2 id="detailParticipantTitle"></h2>

        <div class="detail-participant-list" id="detailParticipantList"></div>
      </section>
    </main>

    <script src="js/quick-item-detail.js"></script>
  </body>
</html>
