<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <link rel="stylesheet" href="css/common.css" />

    <link rel="stylesheet" href="css/signup.css" />

    <title>회원가입 | 스플릿</title>
  </head>

  <body>
    <main class="app-screen signup-screen">
      <section class="signup-box">
        <h1>회원정보를 입력해 주세요.</h1>

        <form id="signupForm">
          <!-- =========================
               ID
          ========================== -->

          <div class="signup-field">
            <label for="userId"> ID </label>

            <div class="input-with-button">
              <input
                type="text"
                id="userId"
                placeholder="4~12자로 입력해 주세요."
              />

              <button type="button" class="inside-button" id="checkIdButton">
                중복 확인
              </button>
            </div>
          </div>

          <!-- =========================
               비밀번호
          ========================== -->

          <div class="signup-field">
            <label for="password"> 비밀번호 </label>

            <input
              type="password"
              id="password"
              placeholder="5~20자, 영문 및 숫자로 조합해 주세요."
            />
          </div>

          <!-- =========================
               비밀번호 확인
          ========================== -->

          <div class="signup-field">
            <label for="passwordConfirm"> 비밀번호 확인 </label>

            <input
              type="password"
              id="passwordConfirm"
              placeholder="비밀번호를 다시 입력해 주세요."
            />
          </div>

          <!-- =========================
               이름
          ========================== -->

          <div class="signup-field">
            <label for="name"> 이름 </label>

            <input type="text" id="name" placeholder="이름을 입력해 주세요." />
          </div>

          <!-- =========================
               이메일
          ========================== -->

          <div class="signup-field">
            <label for="email"> 이메일 </label>

            <div class="input-with-button">
              <input
                type="email"
                id="email"
                placeholder="이메일 주소를 입력해 주세요."
              />

              <button
                type="button"
                class="inside-button"
                id="sendEmailCodeButton"
              >
                인증하기
              </button>
            </div>
          </div>

          <!-- =========================
               이메일 인증번호
          ========================== -->

          <div class="signup-field">
            <label for="emailCode"> 인증번호 </label>

            <div class="input-with-button">
              <input
                type="text"
                id="emailCode"
                maxlength="6"
                placeholder="이메일로 전송된 인증번호를 입력해 주세요."
                disabled
              />

              <button
                type="button"
                class="inside-button"
                id="verifyEmailCodeButton"
                disabled
              >
                인증확인
              </button>
            </div>

            <p class="verification-message" id="emailVerificationMessage"></p>
          </div>

          <!-- =========================
               은행
          ========================== -->

          <div class="signup-field">
            <label for="bank"> 은행 </label>

            <select id="bank">
              <option value="">은행을 선택해 주세요.</option>

              <option value="KB국민은행">KB국민은행</option>

              <option value="신한은행">신한은행</option>

              <option value="우리은행">우리은행</option>

              <option value="하나은행">하나은행</option>

              <option value="NH농협은행">NH농협은행</option>

              <option value="토스뱅크">토스뱅크</option>

              <option value="카카오뱅크">카카오뱅크</option>

              <option value="케이뱅크">케이뱅크</option>
            </select>
          </div>

          <!-- =========================
               계좌번호
          ========================== -->

          <div class="signup-field">
            <label for="accountNumber"> 계좌번호 </label>

            <input
              type="text"
              id="accountNumber"
              inputmode="numeric"
              placeholder="- 없이 계좌번호를 입력해 주세요."
            />
          </div>

          <!-- =========================
               회원가입
          ========================== -->

          <button type="submit" class="signup-button">회원가입</button>
        </form>
      </section>
    </main>

    <script src="js/signup.js"></script>
  </body>
</html>
