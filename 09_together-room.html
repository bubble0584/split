<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>함께 정산하기</title>

    <link rel="stylesheet" href="css/common.css" />
    <link rel="stylesheet" href="css/together-room.css" />
  </head>

  <body>
    <main class="together-room-screen">
      <header class="together-room-header">
        <button
          class="back-button"
          id="backButton"
          type="button"
          aria-label="뒤로가기"
        >
          <img src="./image/back.svg" alt="뒤로가기" />
        </button>

        <h1 id="roomTitle">정산방</h1>

        <button class="delete-room-button" id="deleteRoomButton" type="button">
          삭제
        </button>
      </header>

      <!-- =====================
         본문
    ====================== -->
      <section class="together-room-content">
        <!-- 초대 카드 -->
        <div class="invite-card">
          <div class="invite-text">
            <strong> 초대하기 </strong>

            <span>
              링크나 코드를 공유하여<br />
              참여자를 초대하세요
            </span>
          </div>

          <!-- 공유 버튼 -->
          <button
            class="share-button"
            id="shareButton"
            type="button"
            aria-label="공유하기"
          >
            <img src="./image/share.svg" alt="공유하기" />
          </button>
        </div>

        <!-- 참여자 -->
        <section class="participant-section">
          <h2 id="participantCount">참여자</h2>

          <div class="participant-list" id="participantList"></div>
        </section>
      </section>

      <!-- =====================
         하단 버튼
    ====================== -->
      <div class="bottom-action">
        <button class="primary-button" id="startItemButton" type="button">
          항목 입력하기
        </button>
      </div>
    </main>

    <div class="invite-overlay hidden" id="inviteOverlay">
      <div class="invite-modal">
        <button
          type="button"
          class="invite-close-button"
          id="inviteCloseButton"
        >
          ×
        </button>

        <h2>정산방 초대하기</h2>

        <p class="invite-description">
          링크를 공유하거나 참여 코드를 알려주세요.
        </p>

        <div class="invite-field">
          <label>초대 링크</label>

          <div class="invite-value-box">
            <span id="inviteLink"> https://split.app/join/58321 </span>

            <button type="button" class="copy-button" id="copyLinkButton">
              복사
            </button>
          </div>
        </div>

        <div class="invite-field">
          <label>참여 코드</label>

          <div class="invite-value-box code-box">
            <strong id="inviteCode">58321</strong>

            <button type="button" class="copy-button" id="copyCodeButton">
              복사
            </button>
          </div>
        </div>

        <button type="button" class="share-link-button" id="shareLinkButton">
          링크 공유하기
        </button>
      </div>
    </div>

    <script src="js/together-room.js"></script>
  </body>
</html>
