<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <link rel="stylesheet" href="css/common.css" />
    <link rel="stylesheet" href="css/quick-room.css" />

    <title>빠르게 정산하기 | 스플릿</title>
  </head>

  <body>
    <main class="app-screen quick-room-screen">
      <!-- 상단 헤더 -->
      <header class="quick-header">
        <button type="button" class="back-button" onclick="history.back()">
          <img src="image/뒤로가기.svg" alt="뒤로가기" />
        </button>

        <h1 id="roomTitle">정산방</h1>

        <div class="header-space"></div>
      </header>

      <!-- 참여자 입력 -->
      <section class="participant-input-section">
        <label for="participantInput">참여자 입력</label>

        <div class="participant-input-box">
          <input
            type="text"
            id="participantInput"
            placeholder="이름을 입력하세요"
            autocomplete="off"
          />
        </div>
      </section>

      <!-- 참여자 목록 -->
      <section class="participant-list-section">
        <h2>참여자 목록</h2>

        <div id="participantList"></div>
      </section>

      <!-- 하단 버튼 -->
      <button
        type="button"
        class="start-settlement-button"
        id="startSettlementButton"
      >
        정산 시작하기
      </button>
    </main>

    <script src="js/quick-room.js"></script>
  </body>
</html>
