<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <link rel="stylesheet" href="css/common.css" />
    <link rel="stylesheet" href="css/quick-result.css" />

    <title>정산 결과 | 스플릿</title>
  </head>

  <body>
    <main class="app-screen quick-result-screen">
      <!-- 상단 -->
      <header class="result-header">
        <button type="button" class="back-button" onclick="history.back()">
          ←
        </button>

        <h1>정산 결과</h1>

        <button type="button" class="share-button">공유하기</button>
      </header>

      <!-- 정산 결과 카드들 -->
      <section class="result-list" id="resultList"></section>

      <!-- 하단 -->
      <button
        type="button"
        class="payment-complete-button"
        id="paymentCompleteButton"
      >
        송금완료
      </button>
    </main>

    <script src="js/quick-result.js"></script>
  </body>
</html>
