<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <link rel="stylesheet" href="css/common.css" />
    <link rel="stylesheet" href="css/quick-result.css" />

    <title>정산 결과 | 스플릿</title>
  </head>

  <body>
    <main class="app-screen quick-result-screen">
      <header class="result-header">
        <button type="button" class="back-button" id="backButton">
          <img src="image/back.svg" alt="뒤로가기" />
        </button>

        <h1>정산 결과</h1>

        <button type="button" class="share-button" id="shareButton">
          공유하기
        </button>
      </header>

      <!-- =========================
           정산 결과 목록
      ========================== -->

      <section class="result-list" id="resultList"></section>

      <!-- =========================
           하단 버튼
      ========================== -->

      <div class="result-bottom-actions">
        <button
          type="button"
          class="payment-complete-button"
          id="paymentCompleteButton"
          disabled
        >
          송금완료
        </button>

        <button type="button" class="home-button" id="homeButton">
          홈으로 돌아가기
        </button>
      </div>
    </main>

    <script src="js/quick-result.js"></script>
  </body>
</html>
